&lt;script&gt;
(() =&gt; {
 const root=document.getElementById(&#x27;rop-proposal&#x27;);
 const esc=s=&gt;String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
 const reasons=[&#x27;Douleur / mobilité&#x27;,&#x27;Confort digestif&#x27;,&#x27;Stress / anxiété&#x27;,&#x27;Sommeil&#x27;,&#x27;Fatigue&#x27;,&#x27;Pelvien / uro-génital&#x27;,&#x27;Post-traumatique / post-chirurgical&#x27;,&#x27;Autre&#x27;];
 const signs=[&#x27;Fièvre inexpliquée&#x27;,&#x27;Perte de poids inexpliquée&#x27;,&#x27;Sang dans les selles ou les urines&#x27;,&#x27;Douleur nocturne inhabituelle&#x27;,&#x27;Douleur thoracique&#x27;,&#x27;Essoufflement anormal&#x27;,&#x27;Faiblesse ou trouble neurologique (bras, jambe, parole, vision)&#x27;,&#x27;Aggravation progressive et continue&#x27;,&#x27;Fatigue sévère et inhabituelle&#x27;,&#x27;Aucun de ces signes&#x27;];
 const changes=[&#x27;Beaucoup mieux&#x27;,&#x27;Mieux&#x27;,&#x27;Un peu mieux&#x27;,&#x27;Inchangé&#x27;,&#x27;Un peu moins bien&#x27;,&#x27;Moins bien&#x27;,&#x27;Beaucoup moins bien&#x27;];
 const fields={
  reason:{label:&#x27;Motif principal de consultation&#x27;,options:reasons},duration:{label:&#x27;Depuis combien de temps ressentez-vous ce problème ?&#x27;,options:[&quot;Moins d’un mois&quot;,&#x27;1 à 3 mois&#x27;,&#x27;3 à 12 mois&#x27;,&quot;Plus de 12 mois&quot;,&#x27;Non applicable&#x27;]},

  daily:{label:&#x27;Gêne dans vos activités quotidiennes&#x27;,type:&#x27;scale&#x27;,min:&#x27;Pas limité(e)&#x27;,max:&#x27;Extrêmement limité(e)&#x27;},
  sleep:{label:&#x27;Qualité de votre sommeil ces 7 derniers jours&#x27;,type:&#x27;scale&#x27;,min:&#x27;Très mauvaise&#x27;,max:&#x27;Excellente&#x27;},
  energy:{label:&#x27;Énergie / vitalité ces 7 derniers jours&#x27;,type:&#x27;scale&#x27;,min:&#x27;Épuisé(e)&#x27;,max:&#x27;Excellente vitalité&#x27;},

  digestive:{label:&#x27;Confort digestif / viscéral&#x27;,type:&#x27;scale&#x27;,min:&#x27;Très inconfortable&#x27;,max:&#x27;Très confortable&#x27;,optional:true},
  medical:{label:&#x27;Êtes-vous suivi(e) médicalement pour ce problème ?&#x27;,options:[&#x27;Oui&#x27;,&#x27;Non&#x27;,&#x27;Non applicable&#x27;]},
  safety:{label:&#x27;Présentez-vous actuellement l’un de ces signes ?&#x27;,type:&#x27;multi&#x27;,options:signs,exclusive:&#x27;Aucun de ces signes&#x27;,help:&#x27;Cochez tout ce qui s’applique. Ces questions servent uniquement à votre sécurité.&#x27;},

 };
 const chapters=[{name:&#x27;Votre situation&#x27;,intro:&#x27;Commençons par le motif de votre consultation.&#x27;,ids:[&#x27;reason&#x27;,&#x27;duration&#x27;]},{name:&#x27;Votre ressenti&#x27;,intro:&#x27;Choisissez le nombre qui correspond à votre ressenti.&#x27;,ids:[&#x27;symptom&#x27;,&#x27;daily&#x27;]},{name:&#x27;Votre quotidien&#x27;,intro:&#x27;Pensez à votre expérience des derniers jours.&#x27;,ids:[&#x27;sleep&#x27;,&#x27;energy&#x27;,&#x27;stress&#x27;]},{name:&#x27;Votre sécurité&#x27;,intro:&#x27;Quelques questions pour compléter votre suivi.&#x27;,ids:[&#x27;medical&#x27;,&#x27;safety&#x27;]},{name:&#x27;Relire et envoyer&#x27;,intro:&#x27;Prenez un instant pour vérifier vos réponses.&#x27;,ids:[&#x27;comment&#x27;]}];
 const d={index:1,answers:{reason:reasons[0],duration:&#x27;1 à 3 mois&#x27;},error:&#x27;&#x27;,done:false};
 const m={index:0,answers:{},error:&#x27;&#x27;,done:false};
 function idsFor(chapter){const ids=[...chapters[chapter].ids];if(chapter===2&amp;&amp;[&#x27;Confort digestif&#x27;,&#x27;Pelvien / uro-génital&#x27;].includes(d.answers.reason))ids.push(&#x27;digestive&#x27;);return ids;}
 function mobileIds(){return [&#x27;change&#x27;,&#x27;reactions&#x27;,...(Array.isArray(m.answers.reactions)&amp;&amp;m.answers.reactions.some(x=&gt;x!==&#x27;Aucune réaction&#x27;)?[&#x27;reactionIntensity&#x27;]:[]),&#x27;reactionDuration&#x27;,&#x27;advice&#x27;,&#x27;comment&#x27;];}
 function empty(v){return v===undefined||v===null||v===&#x27;&#x27;||(Array.isArray(v)&amp;&amp;v.length===0);}
